# TEMPLATE — copy from here when adding a new contributor
# -----------------------------------------------------------------------------
# Required fields (minimum for CITATION.cff and CONTRIBUTORS.md):
#   family_names, given_names, at least one repos entry with at least one credit
#
# Recommended fields:
#   orcid       — persistent identifier; use https://orcid.org/0000-0000-0000-0000
#   email       — institutional/work address preferred
#   name_suffix — degrees, e.g. "PhD" or "MD, MPH" (omit if none)
#   affiliations — at least primary; add further blocks for secondary affiliations
#
# CRediT roles (pick all that apply per repo):
#   conceptualization, methodology, software, validation, formal-analysis,
#   investigation, data-curation, writing-original-draft,
#   writing-review-editing, visualization, supervision,
#   project-administration, funding-acquisition, resources
#
# Repo values:
#   "*"   — applies to every repo in the workspace
#   <dir> — a specific repo's `dir` value from studies.yaml
#
# After adding, run: Rscript scripts/sync_contributors.R
# =============================================================================
